name: Effect binding v1.5

on:
  push:
    branches:
      - ocg/effect-binding-v1.5
  pull_request:
    paths:
      - 'src/matverse_stack/effect_binding.py'
      - 'src/matverse_stack/service.py'
      - 'src/matverse_stack/api.py'
      - 'tests/test_effect_binding.py'
      - '.github/workflows/effect-binding-v1.5.yml'

jobs:
  test-effect-binding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run v1.4 and v1.5 focused tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_runtime_enforcement.py tests/test_effect_binding.py
