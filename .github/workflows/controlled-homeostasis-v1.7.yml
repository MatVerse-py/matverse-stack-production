name: Controlled homeostasis v1.7

on:
  push:
    branches:
      - ocg/controlled-homeostasis-v1.7
  pull_request:
    branches:
      - ocg/global-mediation-v1.6

permissions:
  contents: read

jobs:
  test-controlled-homeostasis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Generate deterministic homeostasis report
        env:
          PYTHONPATH: src
        run: |
          python experiments/run_controlled_homeostasis_v1.7.py > controlled_homeostasis_v1.7_report.json
          sha256sum controlled_homeostasis_v1.7_report.json
      - name: Run v1.4-v1.7 focused tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_runtime_enforcement.py \
            tests/test_effect_binding.py \
            tests/test_global_mediation.py \
            tests/test_controlled_homeostasis.py
      - name: Upload deterministic report
        uses: actions/upload-artifact@v4
        with:
          name: controlled-homeostasis-v1.7-report
          path: controlled_homeostasis_v1.7_report.json
          if-no-files-found: error
          retention-days: 30
