name: Instrumented homeostasis v1.8

on:
  push:
    branches:
      - main
      - ocg/instrumented-homeostasis-v1.8
  pull_request:
    paths:
      - "src/matverse_stack/**"
      - "tests/**"
      - "experiments/**"
      - ".github/workflows/instrumented-homeostasis-v1.8.yml"

jobs:
  test-instrumented-homeostasis:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Verify frozen preregistration hash
        run: |
          echo "85e73ac48847d711833974be05e5b8cc27809090c9b2771e369ed9acfc6533a1  experiments/instrumented_homeostasis_v1.8_prereg.json" | sha256sum -c -
      - name: Generate instrumented report
        env:
          PYTHONPATH: src
        run: |
          python experiments/run_instrumented_homeostasis_v1.8.py > instrumented_homeostasis_v1.8_report.json
          sha256sum instrumented_homeostasis_v1.8_report.json
      - name: Run v1.4-v1.8 focused tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_runtime_enforcement.py \
            tests/test_effect_binding.py \
            tests/test_global_mediation.py \
            tests/test_controlled_homeostasis.py \
            tests/test_instrumented_homeostasis.py
      - name: Upload instrumented report
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-homeostasis-v1.8-report
          path: instrumented_homeostasis_v1.8_report.json
          if-no-files-found: error
          retention-days: 30
