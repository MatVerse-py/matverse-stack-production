name: Runtime enforcement v1.4

on:
  push:
    branches:
      - main
      - ocg/runtime-enforcement-v1.4
  pull_request:
    paths:
      - 'src/matverse_stack/constraint_gate.py'
      - 'src/matverse_stack/service.py'
      - 'src/matverse_stack/api.py'
      - 'tests/test_runtime_enforcement.py'
      - '.github/workflows/runtime-enforcement-v1.4.yml'

jobs:
  test-runtime-enforcement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Run runtime enforcement tests
        env:
          PYTHONPATH: src
        run: python -m pytest -q tests/test_runtime_enforcement.py
