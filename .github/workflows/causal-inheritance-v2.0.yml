name: Causal inheritance v2.0

on:
  push:
    branches:
      - main
      - ocg/causal-inheritance-v2.0
  pull_request:
    paths:
      - "src/matverse_stack/causal_inheritance.py"
      - "src/matverse_stack/instrumented_homeostasis.py"
      - "experiments/causal_inheritance_v2.0_prereg*.json"
      - "experiments/instrumented_homeostasis_v1.8_prereg.json"
      - "experiments/run_causal_inheritance_v2_0.py"
      - "tests/test_causal_inheritance.py"
      - "tests/test_instrumented_homeostasis.py"
      - ".github/workflows/causal-inheritance-v2.0.yml"

permissions:
  contents: read

jobs:
  test-causal-inheritance:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest
      - name: Verify frozen preregistration v1.1 hash
        run: |
          echo "d45cacb44d88db878e06ead3a7398eda998ee2398d70b65b00e2f1a276e12a6e  experiments/causal_inheritance_v2.0_prereg_v1.1.json" | sha256sum -c -
      - name: Run preregistered four-arm causal inheritance experiment
        env:
          PYTHONPATH: src
        run: |
          python experiments/run_causal_inheritance_v2_0.py > causal_inheritance_v2.0_report.json
          sha256sum causal_inheritance_v2.0_report.json
      - name: Run integrated v1.4-v2.0 focused tests
        env:
          PYTHONPATH: src
        run: |
          python -m pytest -q \
            tests/test_runtime_enforcement.py \
            tests/test_effect_binding.py \
            tests/test_global_mediation.py \
            tests/test_controlled_homeostasis.py \
            tests/test_instrumented_homeostasis.py \
            tests/test_causal_inheritance.py
      - name: Upload causal inheritance report
        uses: actions/upload-artifact@v4
        with:
          name: causal-inheritance-v2.0-report
          path: causal_inheritance_v2.0_report.json
          if-no-files-found: error
          retention-days: 30
